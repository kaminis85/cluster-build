---
# Lab values for a 2-node cluster. The playbook asks for the admin password
# at startup. That password is set on both consoles and used to log in.
# 192.0.2.0/24 is a documentation range. Replace it with the lab subnet.
# The first node creates the cluster. The second node joins it.

admin_username: admin
# Factory console password. Blank until this playbook sets admin_password.
node_login_password: ""

cluster_name: labcluster
cluster_location: "lab"

# Shared node-mgmt network. A node may override port, netmask, or gateway.
node_mgmt_port: e0M
node_mgmt_netmask: "255.255.255.0"
node_mgmt_gateway: "192.0.2.1"

nodes:
  - mgmt_ip: "192.0.2.11"
    console_command: "ssh -tt -o StrictHostKeyChecking=accept-new REPLACE_ME_NODE1_CONSOLE"
    console_ssh_password: ""
  - mgmt_ip: "192.0.2.12"
    console_command: "ssh -tt -o StrictHostKeyChecking=accept-new REPLACE_ME_NODE2_CONSOLE"
    console_ssh_password: ""

# Cluster management. Port is pre-populated with e0M, as in the wizard.
cluster_mgmt_port: e0M
cluster_mgmt_ip: "192.0.2.10"
cluster_mgmt_netmask: "255.255.255.0"
cluster_mgmt_gateway: "192.0.2.1"

dns_domains:
  - lab.example.com
dns_servers:
  - "192.0.2.53"

# Set false to skip the consoles and only run create/join, after every
# node already has its node-mgmt IP.
bootstrap_console: true
